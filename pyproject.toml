[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guideline-rag"
version = "0.1.0"
description = "Local, free RAG assistant that answers questions from NICE clinical guidelines with verified citations."
requires-python = ">=3.11"
dependencies = [
    "llama-index-core",
    "llama-index-llms-ollama",
    "llama-index-embeddings-ollama",
    "llama-index-vector-stores-qdrant",
    "llama-index-retrievers-bm25",
    "qdrant-client",
    "sentence-transformers",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pymupdf",
    "pydantic",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "streamlit",
    "deepeval",
    "arize-phoenix",
    "openinference-instrumentation-llama-index",
    "matplotlib",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
